<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Sudoku</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1d22;--card:#fff;--ln:#c9ced6;--mut:#6b7280;--acc:hsl(210 75% 50%);--accl:hsl(210 75% 50%/.18)}
[data-theme=dark]{--bg:#111318;--fg:#eceef2;--card:#1c1f26;--ln:#3a3f4a;--mut:#9aa1ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
#hd{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top) + 2px) 10px 0}
#gear{border:0;background:none;color:var(--fg);font-size:30px;line-height:1;padding:6px 10px}#gear.on{color:var(--acc)}
#main{flex:1;overflow:auto;padding:6px 14px 14px;max-width:520px;width:100%;margin:0 auto}
nav{display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 2px;border:0;background:none;color:var(--mut);font-size:13px}nav button.on{color:var(--acc);font-weight:700}
.btn{display:block;width:100%;padding:16px;margin:10px 0;border:0;border-radius:14px;background:var(--acc);color:#fff;font-size:18px;font-weight:600;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--ln)}.btn.on{outline:3px solid var(--acc)}.btn:disabled{opacity:.4}
.btn.s.lk{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:12px 4px;font-size:15px;margin:4px 0}
input{width:100%;padding:14px;font-size:18px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--fg)}
h1{text-align:center;font-size:42px;margin:24px 0 20px}h2{margin:8px 0}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;font-size:15px}
.brd{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1;border:2px solid var(--fg);background:var(--card);margin:8px 0}
.c{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;border:.5px solid var(--ln);font-size:min(7vw,32px);user-select:none;overflow:hidden}
.c.br{border-right:2px solid var(--fg)}.c.bb{border-bottom:2px solid var(--fg)}
.c.p{background:color-mix(in srgb,var(--acc) 9%,transparent)}.c.same{background:var(--accl)}
.c.g{font-weight:700}.c.u{color:var(--acc)}
.c.sel{background:var(--acc)!important;color:#fff!important}
.c.h3{background:#ffd98a!important;color:#000!important}.c.h1{background:#f5a524!important;color:#000!important}
.c.e{background:#e5484d!important;color:#fff!important;font-weight:700}.c.sel.e{box-shadow:inset 0 0 0 3px var(--fg)}
.n{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));width:100%;height:100%;font-size:min(2.7vw,12px);line-height:1;color:var(--mut)}
.n span{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}.n .r{color:#e5484d;text-decoration:line-through;font-weight:700}
.n .k{background:var(--acc);color:#fff;border-radius:50%;font-weight:700}.c.sel .n .k{background:#fff;color:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.row{display:flex;gap:6px}.row .btn{margin:8px 0;font-size:13px;padding:13px 2px}
.ban{background:var(--accl);border-radius:12px;padding:10px 12px;margin-top:6px;min-height:42px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:24px}
.dl{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:340px;text-align:center}
.rw{position:relative;width:min(80vw,300px);aspect-ratio:1;margin:24px auto;touch-action:none}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(hsl(0 75% 50%),hsl(60 75% 50%),hsl(120 75% 50%),hsl(180 75% 50%),hsl(240 75% 50%),hsl(300 75% 50%),hsl(360 75% 50%));-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.th{position:absolute;width:30px;height:30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 4px #0008;transform:translate(-50%,-50%)}
.fin{position:absolute;left:50%;top:50%;width:38%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;color:#fff;font-size:18px;font-weight:700}
</style></head><body>
<header id="hd"><button id="gear" aria-label="Einstellungen">⚙&#xFE0E;</button></header>
<div id="main"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const btn=(t,f,c='')=>{const b=E('button','btn '+c,t);b.onclick=f;return b};
const R=i=>i/9|0,Cc=i=>i%9;
const U=[];for(let r=0;r<9;r++)U.push([...Array(9)].map((_,c)=>r*9+c));
for(let c=0;c<9;c++)U.push([...Array(9)].map((_,r)=>r*9+c));
for(let b=0;b<9;b++)U.push([...Array(9)].map((_,k)=>((b/3|0)*3+(k/3|0))*9+(b%3)*3+k%3));
const P=[...Array(81)].map((_,i)=>[...new Set(U.filter(u=>u.includes(i)).flat())].filter(j=>j!=i));
const pc=m=>{let n=0;while(m){m&=m-1;n++}return n};
const bits=m=>{const a=[];for(let d=1;d<=9;d++)if(m>>d&1)a.push(d);return a};
const sh=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
const LV={easy:'Einfach',medium:'Mittel',hard:'Schwer',expert:'Experte',nightmare:'Alptraum'};
const T={naked:'Nackter Einer',hidden:'Versteckter Einer',point:'Block-Zeilen-Ausschluss',claim:'Zeilen-Block-Ausschluss',nakedN2:'Nacktes Paar',nakedN3:'Nacktes Tripel',hiddenN2:'Verstecktes Paar',hiddenN3:'Verstecktes Tripel',fish2:'X-Wing',fish3:'Swordfish',fish4:'Jellyfish',xy:'XY-Wing',xyz:'XYZ-Wing',ur:'Eindeutiges Rechteck'};

/* ---------- Solver / Generator ---------- */
function mrv(g){let b=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){let m=0x3fe;for(const j of P[i])m&=~(1<<g[j]);const n=pc(m);if(n<bc){bc=n;b=i;bm=m;if(n<2)break}}return[b,bm]}
function count(g,lim=2){const[b,m]=mrv(g);if(b<0)return 1;let t=0;for(const d of bits(m)){g[b]=d;t+=count(g,lim-t);g[b]=0;if(t>=lim)break}return t}
function fill(g){const[b,m]=mrv(g);if(b<0)return true;for(const d of sh(bits(m))){g[b]=d;if(fill(g))return true}g[b]=0;return false}
const cand=g=>g.map((v,i)=>{if(v)return 0;let m=0x3fe;for(const j of P[i])m&=~(1<<g[j]);return m});
const put=(C,g,i,v)=>{g[i]=v;C[i]=0;for(const j of P[i])C[j]&=~(1<<v)};
function combos(a,n,f,s=0,cur=[]){if(cur.length==n)return f(cur);for(let i=s;i<a.length;i++){const r=combos(a,n,f,i+1,[...cur,a[i]]);if(r)return r}}
function single(C,g){
 for(let i=0;i<81;i++)if(!g[i]&&pc(C[i])==1){const v=bits(C[i])[0],inv=[];for(let d=1;d<=9;d++)if(d!=v){const j=P[i].find(j=>g[j]==d);if(j!=null)inv.push(j)}return{cell:i,val:v,tech:'naked',inv}}
 for(const u of U)for(let d=1;d<=9;d++){const cs=u.filter(i=>!g[i]&&C[i]>>d&1);if(cs.length==1){const inv=[];for(const i of u)if(i!=cs[0]&&!g[i]){const j=P[i].find(j=>g[j]==d&&!u.includes(j));if(j!=null&&!inv.includes(j))inv.push(j)}return{cell:cs[0],val:d,tech:'hidden',inv}}}
 return null}
const FX={
xy(C,g){for(let p=0;p<81;p++){if(g[p]||pc(C[p])!=2)continue;const ws=P[p].filter(i=>!g[i]&&pc(C[i])==2);
 for(const a of ws)for(const b of ws){if(b<=a)continue;const sa=C[a]&C[p],sb=C[b]&C[p],za=C[a]&~C[p],zb=C[b]&~C[p];
  if(pc(sa)!=1||pc(sb)!=1||sa==sb||pc(za)!=1||za!=zb)continue;const z=bits(za)[0];
  const rem=P[a].filter(i=>i!=p&&P[b].includes(i)&&!g[i]&&C[i]>>z&1).map(i=>[i,z]);if(rem.length)return{tech:'xy',inv:[p,a,b],rem}}}return null},
xyz(C,g){for(let p=0;p<81;p++){if(g[p]||pc(C[p])!=3)continue;const ws=P[p].filter(i=>!g[i]&&pc(C[i])==2&&(C[i]&~C[p])==0);
 for(const a of ws)for(const b of ws){if(b<=a||(C[a]|C[b])!=C[p]||pc(C[a]&C[b])!=1)continue;const z=bits(C[a]&C[b])[0];
  const rem=P[p].filter(i=>P[a].includes(i)&&P[b].includes(i)&&!g[i]&&C[i]>>z&1).map(i=>[i,z]);if(rem.length)return{tech:'xyz',inv:[p,a,b],rem}}}return null},
ur(C,g){for(let r1=0;r1<9;r1++)for(let r2=r1+1;r2<9;r2++)for(let c1=0;c1<9;c1++)for(let c2=c1+1;c2<9;c2++){
 const q=[r1*9+c1,r1*9+c2,r2*9+c1,r2*9+c2];if(q.some(i=>g[i]))continue;
 if(new Set(q.map(i=>(R(i)/3|0)*3+(Cc(i)/3|0))).size!=2)continue;
 for(const f of q){const o=q.filter(i=>i!=f),m=C[o[0]];if(pc(m)!=2||o.some(i=>C[i]!=m)||(C[f]&m)!=m||C[f]==m)continue;
  return{tech:'ur',inv:q,rem:bits(m).map(d=>[f,d])}}}return null}};
function elim(C,g,w){let r;if(FX[w]&&(r=FX[w](C,g)))return r;
 for(const u of U)for(let d=1;d<=9;d++){const cs=u.filter(i=>!g[i]&&C[i]>>d&1);if(cs.length<2||cs.length>3)continue;
  for(const v of U)if(v!=u&&cs.every(i=>v.includes(i))){const rem=v.filter(i=>!u.includes(i)&&!g[i]&&C[i]>>d&1).map(i=>[i,d]);if(rem.length)return{tech:U.indexOf(u)>17?'point':'claim',inv:cs,rem}}}
 for(const n of[2,3])for(const u of U){const cs=u.filter(i=>!g[i]&&C[i]);
  r=combos(cs.filter(i=>pc(C[i])<=n),n,s=>{const m=s.reduce((a,i)=>a|C[i],0);if(pc(m)!=n)return;const rem=[];cs.forEach(i=>{if(!s.includes(i))bits(C[i]&m).forEach(d=>rem.push([i,d]))});if(rem.length)return{tech:'nakedN'+n,inv:s,rem}});if(r)return r;
  const cd={};for(let d=1;d<=9;d++){const x=cs.filter(i=>C[i]>>d&1);if(x.length>=2&&x.length<=n)cd[d]=x}
  r=combos(Object.keys(cd),n,s=>{const cells=[...new Set(s.flatMap(d=>cd[d]))];if(cells.length!=n)return;const mk=s.reduce((a,d)=>a|(1<<d),0),rem=[];cells.forEach(i=>bits(C[i]&~mk).forEach(d=>rem.push([i,d])));if(rem.length)return{tech:'hiddenN'+n,inv:cells,rem}});if(r)return r}
 for(const n of[2,3,4])for(let d=1;d<=9;d++)for(const t of[0,1]){
  const L=k=>U[t*9+k].filter(i=>!g[i]&&C[i]>>d&1),bs=[];
  for(let k=0;k<9;k++){const l=L(k).length;if(l>=2&&l<=n)bs.push(k)}
  r=combos(bs,n,s=>{const cov=new Set();s.forEach(k=>L(k).forEach(i=>cov.add(t?R(i):Cc(i))));if(cov.size!=n)return;const rem=[];
   for(const c of cov)for(let k=0;k<9;k++)if(!s.includes(k)){const i=t?c*9+k:k*9+c;if(!g[i]&&C[i]>>d&1)rem.push([i,d])}
   if(rem.length)return{tech:'fish'+n,inv:s.flatMap(L),rem}});if(r)return r}
 for(const f of['xy','xyz','ur'])if(r=FX[f](C,g))return r;
 return null}
const lvlOf=t=>/^fish|^xy|^ur/.test(t)?3:(t=='naked'||t=='hidden')?1:2;
function grade(g0){const g=[...g0],C=cand(g);let l=1;for(;;){if(g.every(x=>x))return l;let s=single(C,g);if(s){put(C,g,s.cell,s.val);continue}s=elim(C,g);if(!s)return 9;l=Math.max(l,lvlOf(s.tech));s.rem.forEach(([i,d])=>C[i]&=~(1<<d))}}
function mk(tc){const s=Array(81).fill(0);fill(s);const g=[...s];let n=81;for(const i of sh([...Array(81).keys()])){if(n<=tc)break;const v=g[i];g[i]=0;if(count([...g])!=1)g[i]=v;else n--}return{g,s}}
const CL={easy:[40,l=>l==1],medium:[34,l=>l==1],hard:[30,l=>l==2],expert:[25,l=>l>=2],nightmare:[22,l=>l>=3]};
function gen(k){const[tc,ok]=CL[k];let r;for(let a=0;a<25;a++){r=mk(tc);if(ok(grade(r.g)))break}return r}
function hint(cur,sol,notes){const gg=cur.map((v,i)=>v==sol[i]?v:0);
 const run=C=>{const w=[...gg];let last=null;for(let k=0;k<300;k++){const s=single(C,w);if(s)return last?{cell:s.cell,val:s.val,tech:last.tech,inv:last.inv}:s;const e=elim(C,w);if(!e)return null;e.rem.forEach(([i,d])=>C[i]&=~(1<<d));last=e}return null};
 const r=run(cand(gg).map((m,i)=>notes[i]&&!gg[i]?((m&notes[i])||m):m));
 return r&&r.val==sol[r.cell]?r:run(cand(gg))}
function example(k){const hd=FX[k];for(let a=0;a<(hd?150:80);a++){const{g}=mk(hd?24:26),C=cand(g);for(let n=0;n<200;n++){let s=single(C,g);if(s){if(s.tech==k)return{g:[...g],C:[...C],s};put(C,g,s.cell,s.val);continue}s=elim(C,g,k);if(!s)break;if(s.tech==k)return{g:[...g],C:[...C],s};s.rem.forEach(([i,d])=>C[i]&=~(1<<d))}}return null}

/* ---------- State ---------- */
let S=JSON.parse(localStorage.getItem('sdk')||'{}');S.stats=S.stats||{};S.set=S.set||{dark:matchMedia('(prefers-color-scheme:dark)').matches,hue:210};
const save=()=>localStorage.setItem('sdk',JSON.stringify(S));
const acc=h=>{const s=document.documentElement.style;s.setProperty('--acc',`hsl(${h} 75% 50%)`);s.setProperty('--accl',`hsl(${h} 75% 50%/.18)`)};
let tab='intro',sub=null,sel=null,nm=false,showLv=false,msg='',ex,rev=false,lock=0,LL=0,hueT=null,mg=null,ms=null;
const go=(t,s)=>{tab=t;sub=s||null;if(t=='lesson'){ex=undefined;rev=false}if(t!='design')hueT=null;render()};
const SUN='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linecap="round" style="vertical-align:-4px;margin-left:6px"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
const MOON='<svg width="20" height="20" viewBox="0 0 24 24" fill="var(--acc)" style="vertical-align:-4px;margin-left:6px"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg>';

/* ---------- Board ---------- */
function board(o){const b=E('div','brd');for(let i=0;i<81;i++){const r=R(i),q=Cc(i),c=E('div','c'+(q%3==2&&q<8?' br':'')+(r%3==2&&r<8?' bb':'')+' '+(o.c?o.c(i):'')),v=o.v(i);
 if(v)c.textContent=v;else{const n=E('div','n'),m=o.m(i),rr=o.r?o.r(i):0;for(let d=1;d<=9;d++){const s=E('span','',(m>>d&1)?d:'');if(rr>>d&1)s.className='r';else if(o.hd==d&&(m>>d&1))s.className='k';n.append(s)}c.append(n)}
 if(o.f)c.onclick=()=>o.f(i);b.append(c)}return b}

/* ---------- Mini-Sudoku (Start) ---------- */
function newMini(){const bs=[[1,2,3,4],[3,4,1,2],[2,3,4,1],[4,1,2,3]],dp=sh([1,2,3,4]),o=()=>sh([0,1]).flatMap(b=>sh([0,1]).map(r=>b*2+r)),rw=o(),cl=o(),s=[];
 for(let r=0;r<4;r++)for(let c=0;c<4;c++)s.push(dp[bs[rw[r]][cl[c]]-1]);
 const g=[...s];sh([...Array(16).keys()]).slice(0,7).forEach(i=>g[i]=0);mg={g,p:g.map(v=>!!v)};ms=null}
const mpe=(i,j)=>i!=j&&((i>>2)==(j>>2)||i%4==j%4||((i>>2>>1)==(j>>2>>1)&&(i%4>>1)==(j%4>>1)));
const mbad=i=>mg.g[i]&&mg.g.some((v,j)=>mpe(i,j)&&v==mg.g[i]);
function mput(d){if(ms==null||mg.p[ms])return;mg.g[ms]=d;render();if(mg.g.every((v,i)=>v&&!mbad(i)))setTimeout(()=>{mg=null;go('menu')},700)}
function intro(){if(!mg)newMini();const w=E('div','','<h1>Mini-Sudoku</h1><p class="mut" style="text-align:center;margin:-10px 0 8px">Löse das kleine Rätsel, um zu starten: Jede Zahl von 1 bis 4 kommt in jeder Zeile, Spalte und jedem 2×2-Block genau einmal vor.</p>');
 const b=E('div','brd');b.style.cssText='grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));max-width:340px;margin:16px auto';
 for(let i=0;i<16;i++){const c=E('div','c'+(i%4==1?' br':'')+((i>>2)==1?' bb':'')+(mg.p[i]?' g':mg.g[i]?' u':'')+(i==ms?' sel':'')+(mbad(i)?' e':''),mg.g[i]||'');c.style.fontSize='min(12vw,48px)';c.onclick=()=>{ms=i;render()};b.append(c)}
 const pad=E('div','pad');pad.style.cssText='grid-template-columns:repeat(5,1fr);max-width:340px;margin:auto';
 for(let d=1;d<=4;d++)pad.append(btn(d,()=>mput(d),'s sm'));pad.append(btn('⌫',()=>mput(0),'s sm'));w.append(b,pad);return w}

/* ---------- Screens ---------- */
function menu(){const w=E('div','','<h1>Sudoku</h1>');
 if(S.set.name){const p=E('p','mut');p.style.cssText='text-align:center;font-size:20px;margin:-8px 0 12px';p.textContent='Hallo, '+S.set.name+'!';w.append(p)}
 const b=btn('Weiter',()=>go('game'));b.disabled=!S.game;
 w.append(b,btn('Neues Spiel',()=>{showLv=!showLv;render()},showLv?'on s':''));
 if(showLv)Object.keys(LV).forEach(k=>w.append(btn(LV[k],()=>start(k),'s')));return w}
function start(k){$('#main').innerHTML='<h2 style="text-align:center;margin-top:35vh">Rätsel wird erstellt…</h2>';
 setTimeout(()=>{const r=gen(k);S.game={k,p:r.g,sol:r.s,cur:[...r.g],notes:Array(81).fill(0),t:0,err:0,hint:null,hist:[]};sel=null;nm=false;lock=0;msg='';showLv=false;save();go('game')},40)}
const snap=()=>{const G=S.game;(G.hist=G.hist||[]).push({c:[...G.cur],n:[...G.notes]});if(G.hist.length>60)G.hist.shift()};
const solved=()=>S.game.cur.every((v,i)=>v==S.game.sol[i]);
function act(i,d,tog){const G=S.game;if(G.p[i])return;msg='';
 if(nm){if(G.cur[i]||P[i].some(j=>G.cur[j]==d))return;snap();G.notes[i]^=1<<d}
 else if(G.cur[i]==d){if(!tog)return;snap();G.cur[i]=0}
 else{snap();G.cur[i]=d;G.notes[i]=0;P[i].forEach(j=>G.notes[j]&=~(1<<d));if(d!=G.sol[i]){G.err++;navigator.vibrate&&navigator.vibrate(80)}}
 G.hint=null;save();if(solved())return win();render()}
const digit=d=>{if(sel!=null)act(sel,d,false)};
function padTap(d){if(lock){lock=lock==d?0:d;render()}else digit(d)}
function erase(){const G=S.game;if(sel==null||G.p[sel]||(!G.cur[sel]&&!G.notes[sel]))return;snap();G.cur[sel]=0;G.notes[sel]=0;G.hint=null;msg='';save();render()}
function undo(){const G=S.game,h=G.hist&&G.hist.pop();if(!h)return;G.cur=h.c;G.notes=h.n;G.hint=null;msg='';save();render()}
function tipp(){const G=S.game;msg='';
 if(G.hint&&G.hint.st>=3){const h=G.hint;snap();G.cur[h.cell]=h.val;G.notes[h.cell]=0;P[h.cell].forEach(j=>G.notes[j]&=~(1<<h.val));G.hint=null;sel=h.cell;save();if(solved())return win();return render()}
 if(!G.hint){const r=hint(G.cur,G.sol,G.notes);if(!r){msg='Keine logische Fortsetzung gefunden – prüfe deine Eingaben.';return render()}G.hint={...r,st:0}}
 const h=G.hint;h.st++;if(h.st==1)sel=h.cell;save();render()}
function win(){const G=S.game,s=S.stats[G.k]=S.stats[G.k]||{n:0,e:0,t:0,b:0};s.n++;s.e+=G.err;s.t+=G.t;s.b=s.b?Math.min(s.b,G.t):G.t;S.game=null;save();render();
 const o=E('div','ov',`<div class="dl"><h2>Geschafft! 🎉</h2><p>${LV[G.k]} · ${fmt(G.t)} · ${G.err} Fehler</p></div>`);o.firstChild.append(btn('Hauptmenü',()=>{o.remove();go('menu')}));document.body.append(o)}
function game(){const G=S.game,w=E('div');
 if(!G){w.append(E('h2','','Kein laufendes Spiel'),btn('Neues Spiel',()=>{showLv=true;go('menu')}));return w}
 const h=G.hint,st=h?h.st:0,sv=sel!=null?G.cur[sel]:0,hd=lock||sv;
 w.append(E('div','top',`<b>${LV[G.k]}</b><span>Fehler: ${G.err}</span><span id="tm">${fmt(G.t)}</span>`));
 w.append(board({hd,v:i=>G.cur[i],m:i=>G.notes[i],f:i=>{sel=i;if(lock)act(i,lock,true);else render()},c:i=>{let c=G.p[i]?'g ':G.cur[i]?(G.cur[i]==G.sol[i]?'u ':'e '):'';
  if(sel!=null&&!lock){if(i==sel)c+='sel ';else if(P[sel].includes(i))c+='p '}
  if(hd&&G.cur[i]==hd)c+='same ';
  if(h&&st>=3&&h.inv.includes(i))c+='h3 ';if(h&&st>=1&&i==h.cell)c+='h1 ';return c}}));
 const cnt=d=>G.cur.filter(x=>x==d).length,pad=E('div','pad');
 for(let d=1;d<=9;d++){const b=btn(d,()=>{if(Date.now()-LL<700)return;padTap(d)},'s sm'+(lock==d?' lk':''));let tm;
  b.onpointerdown=()=>{tm=setTimeout(()=>{LL=Date.now();lock=d;render()},450)};
  b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(tm);b.oncontextmenu=e=>e.preventDefault();b.disabled=cnt(d)>=9&&lock!=d;pad.append(b)}
 w.append(pad);
 const r=E('div','row'),u=btn('Rückgängig',undo,'s');u.disabled=!(G.hist&&G.hist.length);
 r.append(btn('Notizen',()=>{nm=!nm;render()},nm?'on s':'s'),btn('Löschen',erase,'s'),u,btn('Tipp',tipp,'s'));w.append(r);
 const tx=msg||(h?[,'Dieses Feld kann als Nächstes gelöst werden.','Strategie: '+T[h.tech],'Die markierten Felder sind für die Lösung wichtig. Ein weiterer Tipp löst das Feld.'][st]:'')||(lock?`Zahl-${lock}-Modus: Ein Tipp auf ein Feld trägt ${nm?'die Notiz ':'die '}${lock} ein. Zum Beenden unten die ${lock} antippen.`:'');
 if(tx)w.append(E('div','ban',tx));return w}
function lessons(){const w=E('div','','<h2>Lektionen</h2>');
 for(const[g,its]of LS){w.append(E('h3','mut',g));its.forEach(it=>w.append(btn(it[1],()=>go('lesson',it),'s')))}return w}
function lesson(){const[k,n,t]=sub,w=E('div');w.append(btn('‹ Zurück',()=>go('lessons'),'s sm'),E('h2','',n),E('p','',t));
 if(!k){w.append(E('p','mut','Ein interaktives Beispiel für diese Strategie folgt in einem späteren Update.'));return w}
 if(ex===undefined){w.append(E('p','mut','Beispiel wird gesucht…'));setTimeout(()=>{ex=example(k);render()},30);return w}
 const nw=btn('Neues Beispiel',()=>{ex=undefined;rev=false;render()},'s');
 if(!ex){w.append(E('p','','Es wurde gerade kein Beispiel gefunden.'),nw);return w}
 const s=ex.s,pl=s.val!=null,rm=i=>s.rem?s.rem.filter(x=>x[0]==i).reduce((a,x)=>a|1<<x[1],0):0;
 w.append(board({v:i=>ex.g[i]||(rev&&pl&&i==s.cell?s.val:0),m:i=>ex.C[i],r:i=>rev&&!pl?rm(i):0,
  c:i=>(pl&&i==s.cell?(rev?'u ':'h1 '):'')+(s.inv.includes(i)?'h3':'')}));
 w.append(E('div','ban',pl?(rev?`In Zeile ${R(s.cell)+1}, Spalte ${Cc(s.cell)+1} gehört die ${s.val}.`:'Orange: das Zielfeld. Gelb: Felder, die Zahlen ausschließen. Welche Zahl gehört hinein?')
  :(rev?'Die rot durchgestrichenen Kandidaten können gestrichen werden.':'Gelb: die beteiligten Felder. Welche Kandidaten lassen sich streichen?')));
 const r=E('div','row');r.append(btn(rev?'Verbergen':'Auflösung zeigen',()=>{rev=!rev;render()},'s'),nw);w.append(r);return w}
function stats(){const w=E('div','','<h2>Statistik</h2>');
 for(const k in LV){const s=S.stats[k];w.append(E('div','card',`<b>${LV[k]}</b><br>`+(s?`Abgeschlossen: ${s.n}<br>Ø Fehler: ${(s.e/s.n).toFixed(1)}<br>Ø Zeit: ${fmt(Math.round(s.t/s.n))}<br>Bestzeit: ${fmt(s.b)}`:'<span class="mut">Noch kein Spiel abgeschlossen</span>')))}return w}
function settings(){const w=E('div','','<h2>Einstellungen</h2>');
 w.append(btn('Profil',()=>go('profil'),'s'),btn('Design',()=>go('design'),'s'),btn('‹ Zurück',()=>go('menu'),'s sm'));return w}
function profil(){const w=E('div');w.append(btn('‹ Zurück',()=>go('settings'),'s sm'),E('h2','','Profil'),E('p','mut','Dein Name (erscheint im Hauptmenü)'));
 const i=E('input');i.value=S.set.name||'';i.placeholder='Name';i.maxLength=24;i.oninput=()=>{S.set.name=i.value.trim();save()};w.append(i);return w}
function design(){const w=E('div');w.append(btn('‹ Zurück',()=>go('settings'),'s sm'),E('h2','','Design'),
 btn(S.set.dark?'Lightmode'+SUN:'Darkmode'+MOON,()=>{S.set.dark=!S.set.dark;save();render()},'s'));
 w.append(E('div','','<div class="rw"><div class="ring"></div><div class="th"></div><button class="fin">Fertig</button></div>'));
 let h=hueT??S.set.hue;const rw=w.querySelector('.rw'),th=w.querySelector('.th'),fin=w.querySelector('.fin');
 const up=()=>{const a=h*Math.PI/180;th.style.left=50+Math.sin(a)*40.5+'%';th.style.top=50-Math.cos(a)*40.5+'%';const c=`hsl(${h} 75% 50%)`;th.style.background=c;fin.style.background=c;acc(h)};
 const mv=e=>{const r=rw.getBoundingClientRect();h=Math.round((Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI+360)%360);hueT=h;up()};
 rw.onpointerdown=e=>{if(e.target==fin)return;rw.setPointerCapture(e.pointerId);mv(e);rw.onpointermove=mv};rw.onpointerup=()=>rw.onpointermove=null;
 fin.onclick=()=>{S.set.hue=h;hueT=null;save();go('settings')};up();return w}

/* ---------- Lektionen ---------- */
const LS=[['Einsteiger-Strategien',[

['hidden','Versteckter Einer','Eine Zahl passt in einer Zeile, Spalte oder einem Block nur in ein einziges Feld – auch wenn dieses Feld noch weitere Kandidaten hat. Dann gehört die Zahl genau dorthin.'],
['naked','Ausschlussverfahren','Prüfe, wo eine Zahl in Zeile, Spalte und Block schon steht. Alle dadurch blockierten Felder scheiden aus. Bleibt in einer Einheit nur ein Feld übrig – oder in einem Feld nur eine Zahl – ist es gelöst.']]],
['Fortgeschrittene Strategien',[
['nakedN2','Nacktes Paar','Zwei Felder einer Einheit enthalten nur dieselben zwei Kandidaten. Diese Zahlen gehören zwingend in diese beiden Felder und können aus allen anderen Feldern der Einheit gestrichen werden.'],
['nakedN3','Nacktes Tripel','Drei Felder einer Einheit enthalten zusammen nur drei verschiedene Kandidaten. Diese drei Zahlen können aus den übrigen Feldern der Einheit gestrichen werden.'],
['hiddenN2','Verstecktes Paar','Zwei Zahlen kommen in einer Einheit nur in denselben zwei Feldern vor. Dann gehören sie dorthin – alle anderen Kandidaten dieser beiden Felder können gestrichen werden.'],
['hiddenN3','Verstecktes Tripel','Drei Zahlen kommen in einer Einheit nur in denselben drei Feldern vor. Alle anderen Kandidaten dieser drei Felder können gestrichen werden.'],
['point','Block-Zeilen-Ausschluss','Liegen alle Kandidaten einer Zahl in einem Block in derselben Zeile (oder Spalte), kann die Zahl im Rest dieser Zeile (Spalte) nicht mehr stehen.'],
['claim','Zeilen-Block-Ausschluss','Liegen alle Kandidaten einer Zahl in einer Zeile (oder Spalte) im selben Block, kann die Zahl im Rest dieses Blocks gestrichen werden.']]],
['Experten-Strategien',[
['fish2','X-Wing','Eine Zahl hat in zwei Zeilen jeweils genau zwei Kandidaten, und beide liegen in denselben zwei Spalten. Dann kann die Zahl in diesen Spalten in allen anderen Zeilen gestrichen werden (auch mit vertauschten Zeilen und Spalten).'],
['fish3','Swordfish','Wie X-Wing, nur mit drei Zeilen und drei Spalten: Die Kandidaten einer Zahl liegen in drei Zeilen ausschließlich in denselben drei Spalten. In diesen Spalten fällt die Zahl in allen anderen Zeilen weg.'],

[null,'Alternierende Ketten','Verbinde Kandidaten abwechselnd über starke und schwache Verbindungen. Daraus folgt, dass bestimmte Kandidaten außerhalb der Kette nicht wahr sein können.']]]];

const SC={intro,menu,game,lessons,lesson,stats,settings,profil,design},NV=[['Hauptmenü','menu'],['Spiel','game'],['Lektionen','lessons'],['Statistik','stats']];
const OF={menu:'menu',game:'game',lessons:'lessons',lesson:'lessons',stats:'stats'},SET=['settings','profil','design'];
function render(){acc(S.set.hue);document.documentElement.dataset.theme=S.set.dark?'dark':'light';
 document.querySelector('meta[name=theme-color]').content=S.set.dark?'#111318':'#f6f7f9';
 const m=$('#main');m.innerHTML='';m.append(SC[tab]());
 $('#hd').style.display=$('#nav').style.display=tab=='intro'?'none':'';$('#gear').className=SET.includes(tab)?'on':'';
 const n=$('#nav');n.innerHTML='';NV.forEach(([t,k])=>{const b=E('button',OF[tab]==k?'on':'',t);b.onclick=()=>{showLv=false;go(k)};n.append(b)})}
$('#gear').onclick=()=>go('settings');
setInterval(()=>{if(tab=='game'&&S.game&&!document.hidden){S.game.t++;const e=$('#tm');if(e)e.textContent=fmt(S.game.t);if(S.game.t%10==0)save()}},1000);
