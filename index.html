<style>

.row{display:flex;gap:6px}.row .btn{margin:8px 0;font-size:13px;padding:13px 2px}

.bst{display:flex;gap:6px;margin-top:8px}.bst .btn{margin:0;font-size:14px;padding:10px 4px}
.c.rm{box-shadow:inset 0 0 0 3px #e5484d}
.ban{background:var(--accl);border-radius:12px;padding:10px 12px;margin-top:6px;min-height:42px}
.acw{color:var(--acc);font-weight:700}
.gm{display:flex;flex-direction:column;height:100%}.gm>*{flex:none}.gm>.bw{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-top:6px}.bw .ban{margin-top:0}
.dl.hlp{text-align:left;max-height:86dvh;overflow-y:auto;font-size:14px;line-height:1.45}.hlp h2{margin:0 0 6px;text-align:center}.hlp h3{margin:14px 0 4px;font-size:15px;color:var(--acc)}.hlp p{margin:0 0 6px}.hlp .btn{position:sticky;bottom:-22px;margin-top:12px;box-shadow:0 22px 0 0 var(--card),0 0 0 8px var(--card)}

.pr{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:14px}.pr b{width:74px;font-weight:600}.pr em{width:52px;text-align:right;font-style:normal;color:var(--mut);font-size:13px}.tr{flex:1;height:10px;background:var(--ln);border-radius:6px;overflow:hidden}.tr i{display:block;height:100%;background:var(--acc);border-radius:6px}
.scht{display:flex;align-items:flex-end;gap:8px;height:140px;margin-top:6px}.sccl{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}.sbar{width:100%;max-width:40px;background:var(--acc);border-radius:7px 7px 2px 2px}.sbv{font-size:11px;color:var(--mut);margin-bottom:3px}.sbl{font-size:10px;color:var(--mut);margin-top:5px;max-width:100%;overflow:hidden;text-overflow:ellipsis}

.card h3{margin:0 0 8px;font-size:15px}

.nd.cr{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 6px var(--accl)}
.nd svg{width:18px;height:18px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:8px 0}

.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:24px}
.dl{background:var(--card);border-radius:18px;padding:22px;width:100%;max-width:340px;text-align:center}

.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(hsl(0 75% 50%),hsl(60 75% 50%),hsl(120 75% 50%),hsl(180 75% 50%),hsl(240 75% 50%),hsl(300 75% 50%),hsl(360 75% 50%));-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.th{position:absolute;width:30px;height:30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 4px #0008;transform:translate(-50%,-50%)}

</style></head><body>
<header id="hd"><button id="back" aria-label="Zurück"></button><button id="gear" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd"><path d="M9.78 4.73L9.96 1.50L14.04 1.50L14.22 4.73A7.6 7.6 0 0 1 17.18 6.44L20.08 4.98L22.12 8.52L19.41 10.29A7.6 7.6 0 0 1 19.41 13.71L22.12 15.48L20.08 19.02L17.18 17.56A7.6 7.6 0 0 1 14.22 19.27L14.04 22.50L9.96 22.50L9.78 19.27A7.6 7.6 0 0 1 6.82 17.56L3.92 19.02L1.88 15.48L4.59 13.71A7.6 7.6 0 0 1 4.59 10.29L1.88 8.52L3.92 4.98L6.82 6.44A7.6 7.6 0 0 1 9.78 4.73ZM8.6 12a3.4 3.4 0 1 0 6.8 0a3.4 3.4 0 1 0-6.8 0Z"/></svg></button></header>
<div id="main"></div>
<nav id="nav"></nav>
<script src="puzzles.js"></script>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const btn=(t,f,c='')=>{const b=E('button','btn '+c,t);b.onclick=f;return b};
const R=i=>i/9|0,Cc=i=>i%9;
const U=[];for(let r=0;r<9;r++)U.push([...Array(9)].map((_,c)=>r*9+c));
for(let c=0;c<9;c++)U.push([...Array(9)].map((_,r)=>r*9+c));
for(let b=0;b<9;b++)U.push([...Array(9)].map((_,k)=>((b/3|0)*3+(k/3|0))*9+(b%3)*3+k%3));
const P=[...Array(81)].map((_,i)=>[...new Set(U.filter(u=>u.includes(i)).flat())].filter(j=>j!=i));
const pc=m=>{let n=0;while(m){m&=m-1;n++}return n};
const bits=m=>{const a=[];for(let d=1;d<=9;d++)if(m>>d&1)a.push(d);return a};
const sh=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
const LV={easy:'Einfach',medium:'Mittel',hard:'Schwer',expert:'Experte',nightmare:'Alptraum'};
const T={naked:'Nackter Einer',hidden:'Versteckter Einer',point:'Block-Zeilen-Ausschluss',claim:'Zeilen-Block-Ausschluss',nakedN2:'Nacktes Paar',nakedN3:'Nacktes Tripel',hiddenN2:'Verstecktes Paar',hiddenN3:'Verstecktes Tripel',fish2:'X-Wing',fish3:'Swordfish',fish4:'Jellyfish',xy:'XY-Wing',xyz:'XYZ-Wing',ur:'Eindeutiges Rechteck',chain:'Alternierende Kette'};

/* ---------- Solver / Generator ---------- */
function mrv(g){let b=-1,bm=0,bc=10;for(let i=0;i<81;i++)if(!g[i]){let m=0x3fe;for(const j of P[i])m&=~(1<<g[j]);const n=pc(m);if(n<bc){bc=n;b=i;bm=m;if(n<2)break}}return[b,bm]}
function count(g,lim=2){const[b,m]=mrv(g);if(b<0)return 1;let t=0;for(const d of bits(m)){g[b]=d;t+=count(g,lim-t);g[b]=0;if(t>=lim)break}return t}
function fill(g){const[b,m]=mrv(g);if(b<0)return true;for(const d of sh(bits(m))){g[b]=d;if(fill(g))return true}g[b]=0;return false}
const cand=g=>g.map((v,i)=>{if(v)return 0;let m=0x3fe;for(const j of P[i])m&=~(1<<g[j]);return m});
const put=(C,g,i,v)=>{g[i]=v;C[i]=0;for(const j of P[i])C[j]&=~(1<<v)};
function combos(a,n,f,s=0,cur=[]){if(cur.length==n)return f(cur);for(let i=s;i<a.length;i++){const r=combos(a,n,f,i+1,[...cur,a[i]]);if(r)return r}}
function single(C,g){
 for(let i=0;i<81;i++)if(!g[i]&&pc(C[i])==1){const v=bits(C[i])[0],inv=[],ds=[];for(let d=1;d<=9;d++)if(d!=v){const j=P[i].find(j=>g[j]==d);if(j!=null){inv.push(j);ds.push(d)}}return{cell:i,val:v,tech:'naked',inv,ds}}
 for(let ui=0;ui<27;ui++){const u=U[ui];for(let d=1;d<=9;d++){const cs=u.filter(i=>!g[i]&&C[i]>>d&1);if(cs.length==1){const inv=[],why=[];
  for(const i of u)if(i!=cs[0]&&!g[i]){const by=P[i].filter(j=>g[j]==d);by.forEach(j=>{if(!inv.includes(j))inv.push(j)});why.push([i,by])}
  return{cell:cs[0],val:d,d,tech:'hidden',u:ui,inv,why}}}}
 return null}
const mkPC=pt=>(C,g)=>{for(let ui=0;ui<27;ui++){if((ui>17)!=!!pt)continue;const u=U[ui];for(let d=1;d<=9;d++){const cs=u.filter(i=>!g[i]&&C[i]>>d&1);if(cs.length<2||cs.length>3)continue;
 for(let vi=0;vi<27;vi++){const v=U[vi];if(vi!=ui&&cs.every(i=>v.includes(i))){const rem=v.filter(i=>!u.includes(i)&&!g[i]&&C[i]>>d&1).map(i=>[i,d]);if(rem.length)return{tech:pt?'point':'claim',u:ui,v:vi,d,inv:cs,rem}}}}}return null};
const mkN=n=>(C,g)=>{for(let ui=0;ui<27;ui++){const cs=U[ui].filter(i=>!g[i]&&C[i]);
 const r=combos(cs.filter(i=>pc(C[i])<=n),n,s=>{const m=s.reduce((a,i)=>a|C[i],0);if(pc(m)!=n)return;const rem=[];cs.forEach(i=>{if(!s.includes(i))bits(C[i]&m).forEach(d=>rem.push([i,d]))});if(rem.length)return{tech:'nakedN'+n,u:ui,dg:bits(m),inv:s,rem}});if(r)return r}return null};
const mkH=n=>(C,g)=>{for(let ui=0;ui<27;ui++){const cs=U[ui].filter(i=>!g[i]&&C[i]),cd={};for(let d=1;d<=9;d++){const x=cs.filter(i=>C[i]>>d&1);if(x.length>=2&&x.length<=n)cd[d]=x}
 const r=combos(Object.keys(cd),n,s=>{const cells=[...new Set(s.flatMap(d=>cd[d]))];if(cells.length!=n)return;const mm=s.reduce((a,d)=>a|(1<<d),0),rem=[];cells.forEach(i=>bits(C[i]&~mm).forEach(d=>rem.push([i,d])));if(rem.length)return{tech:'hiddenN'+n,u:ui,dg:s.map(Number),inv:cells,rem}});if(r)return r}return null};
const mkF=n=>(C,g)=>{for(let d=1;d<=9;d++)for(const t of[0,1]){const L=k=>U[t*9+k].filter(i=>!g[i]&&C[i]>>d&1),bs=[];
 for(let k=0;k<9;k++){const l=L(k).length;if(l>=2&&l<=n)bs.push(k)}
 const r=combos(bs,n,s=>{const cov=new Set();s.forEach(k=>L(k).forEach(i=>cov.add(t?R(i):Cc(i))));if(cov.size!=n)return;const rem=[];
  for(const c of cov)for(let k=0;k<9;k++)if(!s.includes(k)){const i=t?c*9+k:k*9+c;if(!g[i]&&C[i]>>d&1)rem.push([i,d])}
  if(rem.length)return{tech:'fish'+n,d,t,bs:s,cov:[...cov].sort((a,b)=>a-b),inv:s.flatMap(L),rem}});if(r)return r}return null};
const FX={point:mkPC(1),claim:mkPC(0),nakedN2:mkN(2),hiddenN2:mkH(2),nakedN3:mkN(3),hiddenN3:mkH(3),fish2:mkF(2),fish3:mkF(3),fish4:mkF(4),
xy(C,g){for(let p=0;p<81;p++){if(g[p]||pc(C[p])!=2)continue;const ws=P[p].filter(i=>!g[i]&&pc(C[i])==2);
 for(const a of ws)for(const b of ws){if(b<=a)continue;const sa=C[a]&C[p],sb=C[b]&C[p],za=C[a]&~C[p],zb=C[b]&~C[p];
  if(pc(sa)!=1||pc(sb)!=1||sa==sb||pc(za)!=1||za!=zb)continue;const z=bits(za)[0];
  const rem=P[a].filter(i=>i!=p&&P[b].includes(i)&&!g[i]&&C[i]>>z&1).map(i=>[i,z]);if(rem.length)return{tech:'xy',dg:[bits(sa)[0],bits(sb)[0],z],inv:[p,a,b],rem}}}return null},
xyz(C,g){for(let p=0;p<81;p++){if(g[p]||pc(C[p])!=3)continue;const ws=P[p].filter(i=>!g[i]&&pc(C[i])==2&&(C[i]&~C[p])==0);
 for(const a of ws)for(const b of ws){if(b<=a||(C[a]|C[b])!=C[p]||pc(C[a]&C[b])!=1)continue;const z=bits(C[a]&C[b])[0];
  const rem=P[p].filter(i=>P[a].includes(i)&&P[b].includes(i)&&!g[i]&&C[i]>>z&1).map(i=>[i,z]);if(rem.length)return{tech:'xyz',z,pd:bits(C[p]),ad:bits(C[a]),bd:bits(C[b]),inv:[p,a,b],rem}}}return null},
ur(C,g){for(let r1=0;r1<9;r1++)for(let r2=r1+1;r2<9;r2++)for(let c1=0;c1<9;c1++)for(let c2=c1+1;c2<9;c2++){
 const q=[r1*9+c1,r1*9+c2,r2*9+c1,r2*9+c2];if(q.some(i=>g[i]))continue;
 if(new Set(q.map(i=>(R(i)/3|0)*3+(Cc(i)/3|0))).size!=2)continue;
 for(const f of q){const o=q.filter(i=>i!=f),m=C[o[0]];if(pc(m)!=2||o.some(i=>C[i]!=m)||(C[f]&m)!=m||C[f]==m)continue;
  return{tech:'ur',f,dg:bits(m),inv:q,rem:bits(m).map(d=>[f,d])}}}return null},
chain(C,g){for(let d=1;d<=9;d++){const has=i=>!g[i]&&C[i]>>d&1,st={};
 for(const u of U){const cs=u.filter(has);if(cs.length==2){(st[cs[0]]=st[cs[0]]||[]).push(cs[1]);(st[cs[1]]=st[cs[1]]||[]).push(cs[0])}}
 const dfs=(ch,dep)=>{const a=ch[0],e=ch[ch.length-1];for(const y of P[e]){if(!has(y)||ch.includes(y)||!st[y])continue;for(const z of st[y]){if(ch.includes(z))continue;const nc=[...ch,y,z];
  const rem=P[a].filter(i=>P[z].includes(i)&&has(i)&&!nc.includes(i)).map(i=>[i,d]);if(rem.length)return{tech:'chain',d,ends:[a,z],inv:nc,rem};
  if(dep<3){const r=dfs(nc,dep+1);if(r)return r}}}return null};
 for(const a in st)for(const b of st[a]){const r=dfs([+a,b],1);if(r)return r}}return null}};
const ORD=['point','claim','nakedN2','hiddenN2','nakedN3','hiddenN3','fish2','fish3','fish4','xy','xyz','ur'];
function elim(C,g,w,ch){if(w)return FX[w]?FX[w](C,g):null;for(const k of ORD){const r=FX[k](C,g);if(r)return r}return ch?FX.chain(C,g):null}
const lvlOf=t=>/^fish|^xy|^ur|^chain/.test(t)?3:(t=='naked'||t=='hidden')?1:2;
function grade(g0){const g=[...g0],C=cand(g);let l=1;for(;;){if(g.every(x=>x))return l;let s=single(C,g);if(s){put(C,g,s.cell,s.val);continue}s=elim(C,g);if(!s)return 9;l=Math.max(l,lvlOf(s.tech));s.rem.forEach(([i,d])=>C[i]&=~(1<<d))}}
function mk(tc){const s=Array(81).fill(0);fill(s);const g=[...s];let n=81;for(const i of sh([...Array(81).keys()])){if(n<=tc)break;const v=g[i];g[i]=0;if(count([...g])!=1)g[i]=v;else n--}return{g,s}}
const CL={easy:[40,l=>l==1],medium:[34,l=>l==1],hard:[30,l=>l==2],expert:[25,l=>l>=2],nightmare:[22,l=>l>=3]};
function gen(k){const[tc,ok]=CL[k];let r;for(let a=0;a<25;a++){r=mk(tc);if(ok(grade(r.g)))break}return r}
/* ---------- Erklärungen ---------- */
const cn=i=>`Z${R(i)+1}/S${Cc(i)+1}`,BN=['oben links','oben Mitte','oben rechts','Mitte links','Mitte','Mitte rechts','unten links','unten Mitte','unten rechts'];
const UN=u=>u<9?`Zeile ${u+1}`:u<18?`Spalte ${u-8}`:`Block ${BN[u-18]}`,dl=a=>a.join(', ');
function xs(s){const t=s.tech,v=s.inv;
 if(t=='naked')return `${cn(s.cell)}: nur die ${s.val} ist noch möglich.`;
 if(t=='hidden')return `In ${UN(s.u)} passt die ${s.val} nur nach ${cn(s.cell)}.`;
 if(t=='point'||t=='claim')return `${UN(s.u)}: die ${s.d} liegt nur in ${UN(s.v)}.`;
 if(t[0]=='n'&&t[4]=='d')return `${UN(s.u)}: ${v.length} Felder enthalten nur ${dl(s.dg)}.`;
 if(t[0]=='h'&&t[6]=='N')return `${UN(s.u)}: ${dl(s.dg)} nur in diesen ${v.length} Feldern.`;

   if(s)return s.val==sol[s.cell]?{...s,kind:'single',nt,steps:[],all:s.inv,names:[T[s.tech]],txt:explain(s)}:null;
   const e=elim(C,gg,0,1);if(!e)return null;

 let r=run(cand(gg),0);if(r)return r;
